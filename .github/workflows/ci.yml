name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client
        run: pnpm --filter pulse-client build

      - name: Build server
        run: pnpm --filter pulse-server build

      - name: Test client (Vitest)
        run: pnpm --filter pulse-client test

      - name: Test server (Jest + Supertest)
        run: pnpm --filter pulse-server test
        env:
          NODE_ENV: test
